version: '3.8'

services:
  jupyter:
    build: .
    container_name: jupyter_server
    # We use 'expose' instead of 'ports' so it's only available to Nginx on the internal Docker network
    expose:
      - "8888"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - jupyter
    restart: unless-stopped
