[cerebrium.deployment]
name = "jupyterlab"
disable_auth = true
include = ["*"]
exclude = [".*"]

[cerebrium.runtime.custom]
port = 8192
healthcheck_endpoint = ""     # empty string => TCP check
readycheck_endpoint  = ""     # empty string => TCP check
dockerfile_path = "./Dockerfile"

[cerebrium.hardware]
cpu = 2
memory = 4.0
compute = "CPU"

[cerebrium.scaling]
min_replicas = 1
max_replicas = 1
replica_concurrency = 1
cooldown = 60
